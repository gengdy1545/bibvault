name: Quality gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --extra dev
      - name: Run offline unit tests with coverage
        run: >-
          uv run --no-sync --with 'pytest-cov==7.1.0' pytest
          -m 'not live and not crawl4ai and not browser'
          --cov=bibvault
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-report=json:coverage.json
      - name: Upload coverage baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: |
            coverage.xml
            coverage.json
          if-no-files-found: warn
          retention-days: 30

  static-analysis:
    name: Ruff and mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync ruff check src tests
      - run: uv run --no-sync mypy

  wheel-smoke:
    name: Build and install wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv build --wheel --out-dir dist
      - run: uv venv --python 3.11 .venv-smoke
      - run: uv pip install --python .venv-smoke/bin/python dist/*.whl
      - run: .venv-smoke/bin/bibvault --help
