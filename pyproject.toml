[project]
name = "bibvault"
version = "0.1.0"
description = "BibTeX-driven scholarly content acquisition and local reference mapping"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "aiohttp>=3.11",
    "bibtexparser>=1.4.3,<2",
    "crawl4ai>=0.9,<1",
    "cryptography>=50.0.2",
    "httpx>=0.27",
    "pydantic>=2",
    "pymupdf>=1.24",
    "tomlkit>=0.15.1",
    "trafilatura>=2.3.1",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "mcp>=1.8",
    "mypy>=1.10",
    "pytest>=8",
    "respx>=0.21",
    "ruff>=0.6",
]
mcp = [
    "mcp>=1.8",
]

[project.scripts]
bibvault = "bibvault.cli:app"
bibvault-mcp = "bibvault.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bibvault"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "browser: launches an installed interactive browser; opt in explicitly",
    "crawl4ai: exercises the Crawl4AI adapter instead of the test HTTP shim",
    "live: hits the real network; runs only with BIBVAULT_LIVE_TESTS=1",
]

[tool.coverage.run]
branch = true
source = ["bibvault"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
files = ["src"]
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["bibtexparser.*", "crawl4ai.*", "pymupdf", "pymupdf.*", "trafilatura.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

